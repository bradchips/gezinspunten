<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315b4c"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Gezinspunten</title></head><body>
<header><div><small>Gezinspunten</small><h1 id="title">Vandaag</h1></div><button id="modeBtn" class="ghost">🔒 Oudermodus</button></header>
<main>
<section id="childView"><div id="children" class="children"></div><div class="scorecard"><div><span id="childName">Sem</span><strong><span id="score">0</span> ⭐</strong></div><div><small>Volgende beloning</small><b id="nextReward">—</b><progress id="rewardProgress" max="100" value="0"></progress></div></div><h2>Vandaag</h2><div id="tasks" class="cards"></div><h2>Beloningen</h2><div id="rewards" class="cards"></div></section>
<section id="parentView" hidden><div class="toolbar"><button id="backBtn" class="ghost">← Kindmodus</button><button id="resetBtn" class="danger ghost">Demo resetten</button></div><h2>Wacht op goedkeuring</h2><div id="pending" class="cards"></div><h2>Snelle punten</h2><div id="adjustments" class="cards"></div><h2>Historie</h2><div id="history" class="history"></div></section>
</main><dialog id="pinDialog"><form method="dialog"><h2>Ouder-PIN</h2><p>Voer de 4-cijferige PIN in.</p><input id="pinInput" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="off"><p id="pinError" class="error"></p><div class="actions"><button value="cancel" class="ghost">Annuleren</button><button id="pinSubmit" value="default">Openen</button></div><small>Start-PIN voor deze versie: 1234</small></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
